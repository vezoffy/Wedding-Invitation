<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Base shadow for a 3D effect -->
  <rect x="12" y="12" width="376" height="276" fill="rgba(0,0,0,0.1)" rx="4"/>
  
  <!-- Back of the envelope -->
  <rect x="10" y="10" width="380" height="280" fill="#Fdfbf7" rx="4" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Left Side Flap -->
  <polygon points="10,10 160,150 10,290" fill="#F4EFE6" stroke="#D4AF37" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Right Side Flap -->
  <polygon points="390,10 240,150 390,290" fill="#F4EFE6" stroke="#D4AF37" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Bottom Flap -->
  <polygon points="10,290 200,180 390,290" fill="#FDFBF7" stroke="#D4AF37" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
