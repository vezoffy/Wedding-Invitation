<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 964 1164" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Outer Solid Gold Border -->
  <rect x="20" y="20" width="960" height="1160" fill="none" stroke="#D4AF37" stroke-width="4" rx="10"/>
  
  <!-- Inner Dashed Maroon Border -->
  <rect x="40" y="40" width="920" height="1120" fill="none" stroke="#8B0000" stroke-width="2" stroke-dasharray="12, 8" rx="5"/>

  <!-- Top Left Corner Intricate Mandala -->
  <g transform="translate(40, 40)">
    <!-- Soft background fill -->
    <path d="M 0 350 C 120 350 350 120 350 0 L 0 0 Z" fill="#8B0000" opacity="0.05"/>
    
    <!-- Concentric ornate arches -->
    <path d="M 0 300 C 100 300 300 100 300 0" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <path d="M 0 250 C 80 250 250 80 250 0" fill="none" stroke="#8B0000" stroke-width="4"/>
    <path d="M 0 180 C 50 180 180 50 180 0" fill="none" stroke="#D4AF37" stroke-width="3"/>
    
    <!-- Inner corner details -->
    <circle cx="60" cy="60" r="25" fill="#D4AF37"/>
    <circle cx="60" cy="60" r="12" fill="#8B0000"/>
    <path d="M 120 0 L 140 20 L 160 0 Z" fill="#8B0000"/>
    <path d="M 0 120 L 20 140 L 0 160 Z" fill="#8B0000"/>
  </g>

  <!-- Top Right Corner Intricate Mandala -->
  <g transform="translate(960, 40) scale(-1, 1)">
    <path d="M 0 350 C 120 350 350 120 350 0 L 0 0 Z" fill="#8B0000" opacity="0.05"/>
    <path d="M 0 300 C 100 300 300 100 300 0" fill="none" stroke="#D4AF37" stroke-width="6"/>
    <path d="M 0 250 C 80 250 250 80 250 0" fill="none" stroke="#8B0000" stroke-width="4"/>
    <path d="M 0 180 C 50 180 180 50 180 0" fill="none" stroke="#D4AF37" stroke-width="3"/>
    <circle cx="60" cy="60" r="25" fill="#D4AF37"/>
    <circle cx="60" cy="60" r="12" fill="#8B0000"/>
    <path d="M 120 0 L 140 20 L 160 0 Z" fill="#8B0000"/>
    <path d="M 0 120 L 20 140 L 0 160 Z" fill="#8B0000"/>
  </g>

  <!-- Bottom Left Corner -->
  <g transform="translate(40, 1160) scale(1, -1)">
     <path d="M 0 250 C 80 250 250 80 250 0" fill="none" stroke="#D4AF37" stroke-width="6"/>
     <path d="M 0 200 C 60 200 200 60 200 0" fill="none" stroke="#8B0000" stroke-width="4"/>
     <circle cx="50" cy="50" r="15" fill="#D4AF37"/>
  </g>

  <!-- Bottom Right Corner -->
  <g transform="translate(960, 1160) scale(-1, -1)">
     <path d="M 0 250 C 80 250 250 80 250 0" fill="none" stroke="#D4AF37" stroke-width="6"/>
     <path d="M 0 200 C 60 200 200 60 200 0" fill="none" stroke="#8B0000" stroke-width="4"/>
     <circle cx="50" cy="50" r="15" fill="#D4AF37"/>
  </g>

  <!-- Top Center Hanging Temple Motifs -->
  <g transform="translate(500, 40)">
    <!-- Center Main Drop -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#D4AF37" stroke-width="3"/>
    <path d="M -35 180 C -35 140 35 140 35 180 C 45 220 -45 220 -35 180 Z" fill="#8B0000"/>
    <circle cx="0" cy="225" r="10" fill="#D4AF37"/>
    <circle cx="0" cy="250" r="6" fill="#D4AF37"/>

    <!-- Left Side Drop -->
    <line x1="-180" y1="0" x2="-180" y2="120" stroke="#8B0000" stroke-width="2"/>
    <path d="M -205 120 C -205 95 -155 95 -155 120 C -145 150 -215 150 -205 120 Z" fill="#D4AF37"/>
    <circle cx="-180" cy="155" r="6" fill="#8B0000"/>
    
    <!-- Right Side Drop -->
    <line x1="180" y1="0" x2="180" y2="120" stroke="#8B0000" stroke-width="2"/>
    <path d="M 155 120 C 155 95 205 95 205 120 C 215 150 145 150 155 120 Z" fill="#D4AF37"/>
    <circle cx="180" cy="155" r="6" fill="#8B0000"/>
  </g>
</svg>
