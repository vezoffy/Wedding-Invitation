<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 960 1160" width="100%" height="100%" preserveAspectRatio="none">
  <!-- Elegant Double Border -->
  <rect x="20" y="20" width="960" height="1160" fill="none" stroke="#D4AF37" stroke-width="3" rx="8"/>
  <rect x="30" y="30" width="940" height="1140" fill="none" stroke="#8B0000" stroke-width="1.5" rx="4"/>

  <!-- Top Palace/Mandap Scalloped Arches -->
  <path d="M 30 30 
           Q 147.5 180 265 30 
           Q 382.5 180 500 30 
           Q 617.5 180 735 30 
           Q 852.5 180 970 30" 
        fill="none" stroke="#D4AF37" stroke-width="4"/>
        
  <path d="M 30 42 
           Q 147.5 192 265 42 
           Q 382.5 192 500 42 
           Q 617.5 192 735 42 
           Q 852.5 192 970 42" 
        fill="none" stroke="#8B0000" stroke-width="1.5"/>

  <!-- Hanging Traditional Indian Wedding Bells (Ghantis) -->
  <!-- Left Bell -->
  <g transform="translate(147.5, 95)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Bell Dome -->
    <path d="M -18 70 C -18 40 18 40 18 70 Z" fill="#8B0000"/>
    <!-- Bell Base/Clapper -->
    <path d="M -20 70 L 20 70 L 18 74 L -18 74 Z" fill="#D4AF37"/>
    <circle cx="0" cy="78" r="4" fill="#D4AF37"/>
    <circle cx="0" cy="85" r="2" fill="#8B0000"/>
  </g>

  <!-- Center-Left Bell (Longer) -->
  <g transform="translate(382.5, 95)">
    <line x1="0" y1="0" x2="0" y2="130" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M -22 130 C -22 90 22 90 22 130 Z" fill="#8B0000"/>
    <path d="M -25 130 L 25 130 L 22 135 L -22 135 Z" fill="#D4AF37"/>
    <circle cx="0" cy="140" r="5" fill="#D4AF37"/>
    <circle cx="0" cy="149" r="3" fill="#8B0000"/>
  </g>

  <!-- Center-Right Bell (Longer) -->
  <g transform="translate(617.5, 95)">
    <line x1="0" y1="0" x2="0" y2="130" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M -22 130 C -22 90 22 90 22 130 Z" fill="#8B0000"/>
    <path d="M -25 130 L 25 130 L 22 135 L -22 135 Z" fill="#D4AF37"/>
    <circle cx="0" cy="140" r="5" fill="#D4AF37"/>
    <circle cx="0" cy="149" r="3" fill="#8B0000"/>
  </g>

  <!-- Right Bell -->
  <g transform="translate(852.5, 95)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M -18 70 C -18 40 18 40 18 70 Z" fill="#8B0000"/>
    <path d="M -20 70 L 20 70 L 18 74 L -18 74 Z" fill="#D4AF37"/>
    <circle cx="0" cy="78" r="4" fill="#D4AF37"/>
    <circle cx="0" cy="85" r="2" fill="#8B0000"/>
  </g>

  <!-- Bottom Left Lotus Flourish -->
  <g transform="translate(30, 1170)">
     <path d="M 0 -180 C 80 -180 180 -80 180 0" fill="none" stroke="#D4AF37" stroke-width="4"/>
     <path d="M 0 -160 C 60 -160 160 -60 160 0" fill="none" stroke="#8B0000" stroke-width="1.5"/>
     
     <!-- Lotus Petals -->
     <path d="M 15 -15 C 15 -80 80 -80 80 -15 C 80 15 15 15 15 -15 Z" fill="#8B0000" opacity="0.9"/>
     <path d="M 25 -25 C 25 -60 60 -60 60 -25 C 60 0 25 0 25 -25 Z" fill="#D4AF37"/>
     
     <circle cx="100" cy="-30" r="4" fill="#8B0000"/>
     <circle cx="120" cy="-20" r="3" fill="#D4AF37"/>
     <circle cx="30" cy="-100" r="4" fill="#8B0000"/>
     <circle cx="20" cy="-120" r="3" fill="#D4AF37"/>
  </g>

  <!-- Bottom Right Lotus Flourish -->
  <g transform="translate(970, 1170) scale(-1, 1)">
     <path d="M 0 -180 C 80 -180 180 -80 180 0" fill="none" stroke="#D4AF37" stroke-width="4"/>
     <path d="M 0 -160 C 60 -160 160 -60 160 0" fill="none" stroke="#8B0000" stroke-width="1.5"/>
     
     <!-- Lotus Petals -->
     <path d="M 15 -15 C 15 -80 80 -80 80 -15 C 80 15 15 15 15 -15 Z" fill="#8B0000" opacity="0.9"/>
     <path d="M 25 -25 C 25 -60 60 -60 60 -25 C 60 0 25 0 25 -25 Z" fill="#D4AF37"/>
     
     <circle cx="100" cy="-30" r="4" fill="#8B0000"/>
     <circle cx="120" cy="-20" r="3" fill="#D4AF37"/>
     <circle cx="30" cy="-100" r="4" fill="#8B0000"/>
     <circle cx="20" cy="-120" r="3" fill="#D4AF37"/>
  </g>
</svg>
